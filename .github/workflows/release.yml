# Turn approved release notes into a validated GitHub release.
# Adapted from Code Rules' release workflow. A rule library ships no binaries, so the
# release is the tag plus the approved notes; validation is `code-rules library check`.
name: Release
# Validate notes and release tooling while they are in a PR. A notes change on main
# approves publication, so ordinary rule changes do not create releases automatically.
on:
  push:
    branches: [main]
    paths: ['releases/v*.md']
  pull_request:
    paths: ['releases/**', '_tools/**', '.github/workflows/release.yml']
  # Preserve both endpoints of the approved push: a rebase merge can contain several commits.
  workflow_dispatch:
    inputs:
      commit:
        description: 'Approved head SHA from the original failed run summary'
        required: true
        type: string
      base:
        description: 'Base SHA from the original failed run summary (before the approved push)'
        required: true
        type: string
# Planning and validation only need read access. Grant write access separately to the
# final job so validation tools cannot modify tags or releases.
permissions:
  contents: read
env:
  # Pin the validator to a reviewed Code Rules commit until Code Rules publishes releases.
  CODE_RULES_MODULE: github.com/fabricahq/code-rules/cmd/code-rules@v0.0.0-20260923222800-f46216a11d67
jobs:
  # Resolve the notes change into one version, source commit, and approved release body.
  # Sharing this plan keeps later jobs tied to the same request instead of rereading main.
  plan:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version ordering and retry validation require the full commit history and tags.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test the release planner
        run: python3 -m unittest discover -s _tools
      - name: Validate the committed release request
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RETRY: ${{ inputs.commit }}
          RETRY_BASE: ${{ inputs.base }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$RETRY" =~ ^[0-9a-f]{40}$ && "$RETRY_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo 'Retry requires full base and approved head SHAs'; exit 1; }
            git merge-base --is-ancestor "$RETRY" origin/main
            HEAD="$RETRY"
            BASE="$RETRY_BASE"
          fi
          # Keep retry inputs available even when planning or a later job fails.
          printf 'Release request range\n\nBase SHA: `%s`\n\nApproved head SHA: `%s`\n' "$BASE" "$HEAD" >> "$GITHUB_STEP_SUMMARY"
          python3 _tools/plan_release.py --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/release-plan.json"
          if [ "$EVENT" = workflow_dispatch ]; then
            jq -e '.tag != ""' "$RUNNER_TEMP/release-plan.json" > /dev/null || { echo 'Retry range contains no release request'; exit 1; }
          fi
          jq -r '"tag=\(.tag)\ncommit=\(.commit)"' "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_OUTPUT"
      # The publisher reads the approved notes from this artifact, not from a checkout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

  # Check the exact planned commit with the Code Rules validator, as contributors do locally.
  check:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Validate the library
        run: |
          go install "$CODE_RULES_MODULE"
          "$(go env GOPATH)/bin/code-rules" library check

  # Give write access only to the job that creates the tag and publishes the release.
  # It checks out no source and verifies every remote fact before and after writing.
  publish:
    needs: [plan, check]
    if: needs.plan.outputs.tag != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # Serialize publication across all versions to prevent competing releases from racing.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - name: Tag the approved commit and publish the approved notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan/release-plan.json"
          notes="$RUNNER_TEMP/notes.md"
          tag=$(jq -r .tag "$plan")
          previous=$(jq -r .previous "$plan")
          prerelease=$(jq -r .prerelease "$plan")
          jq -j .notes "$plan" > "$notes"
          [ "$(jq -r .commit "$plan")" = "$COMMIT" ] || { echo 'Plan and job inputs disagree'; exit 1; }

          # Resolve a remote tag to its commit, peeling annotated tags. Prints nothing if absent.
          tag_commit() {
            local ref
            ref=$(gh api "repos/$GH_REPO/git/ref/tags/$1" 2>/dev/null) || return 0
            if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref")" -q .object.sha
            else
              jq -r .object.sha <<<"$ref"
            fi
          }

          # Refuse to publish over version tags that appeared after planning.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          remote=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" -q '.[].ref' | sed 's#^refs/tags/##' | grep -E "$semver" | grep -vxF "$tag" | sort || true)
          [ "$remote" = "$(jq -r '.tags[]' "$plan" | sort)" ] || { echo "Version tags changed since planning; plan again"; exit 1; }

          if [ -n "$previous" ]; then
            [ "$(gh release view "$previous" --json isDraft -q .isDraft)" = false ] || { echo "Publish $previous first"; exit 1; }
          fi

          existing=$(tag_commit "$tag")
          if [ -n "$existing" ] && [ "$existing" != "$COMMIT" ]; then
            echo "$tag already points to $existing, not the approved $COMMIT"; exit 1
          fi

          # A retry after a successful publication makes no writes.
          if release=$(gh release view "$tag" --json name,body,isDraft,isPrerelease 2>/dev/null); then
            jq -e --arg tag "$tag" --argjson pre "$prerelease" --rawfile notes "$notes" \
              'def norm: gsub("\r\n"; "\n") | sub("\\s+$"; ""); .name == $tag and (.body | norm) == ($notes | norm) and .isPrerelease == $pre' <<<"$release" > /dev/null \
              || { echo "An existing $tag release differs from the approved notes; resolve it by hand"; exit 1; }
            if [ "$(jq -r .isDraft <<<"$release")" = false ]; then
              echo "$tag is already published"; exit 0
            fi
            gh release edit "$tag" --draft=false --latest="$([ "$prerelease" = true ] && echo false || echo true)"
          else
            flags=(--latest)
            [ "$prerelease" = true ] && flags=(--prerelease --latest=false)
            gh release create "$tag" --target "$COMMIT" --title "$tag" --notes-file "$notes" "${flags[@]}"
          fi

          [ "$(tag_commit "$tag")" = "$COMMIT" ] || { echo "$tag does not point to the approved commit after publication"; exit 1; }
          gh release view "$tag" --json url -q .url >> "$GITHUB_STEP_SUMMARY"
