name: Check
# Validate the library and its README on every pull request and on main.
on:
  pull_request:
  push:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the latest stable release so the library is always checked with the
      # current CLI. The installer verifies the archive against the release's
      # SHA256SUMS and checks that the executable runs before installing it.
      - name: Install the latest Code Rules release
        run: |
          curl -fsSL https://code-rules.fabricahq.com/install.sh |
            sh -s -- --install-dir "$RUNNER_TEMP/bin" --no-update-path
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "Checked with Code Rules $("$RUNNER_TEMP/bin/code-rules" --version)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the library
        run: code-rules library check
      - name: Check that README.md matches the library
        run: python3 .github/scripts/check-readme.py
